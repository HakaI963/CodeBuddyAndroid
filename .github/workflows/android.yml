name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, lint, build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          # The ubuntu-latest image ships the Android SDK preinstalled.
          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CBM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "CBM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "CBM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "CBM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "No keystore secret; release APK will be unsigned."
          fi

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Collect and verify artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/CodeBuddyMobile-1.0.0-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/CodeBuddyMobile-1.0.0-release.apk
            echo "Verifying release signature..."
            keytool -printcert -jarfile artifacts/CodeBuddyMobile-1.0.0-release.apk | head -20
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/CodeBuddyMobile-1.0.0-release-unsigned.apk
            echo "Release APK is unsigned (no keystore secret)."
          else
            echo "No release APK produced" >&2
            exit 1
          fi
          ( cd artifacts && sha256sum ./*.apk > SHA256SUMS.txt )
          ls -l artifacts
          du -h artifacts/*.apk

      - name: Publish APKs to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('CodeBuddy Mobile {0}', github.ref_name) || 'CodeBuddy Mobile - latest CI build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          body: |
            Automated build of CodeBuddy Mobile.

            - `CodeBuddyMobile-1.0.0-release.apk` - signed release build (R8 + resource shrinking)
            - `CodeBuddyMobile-1.0.0-debug.apk` - debug build (`com.flux.codebuddy.debug`)
            - `SHA256SUMS.txt` - checksums
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
